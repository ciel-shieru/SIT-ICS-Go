name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Gate: require maintainer approval for external contributors ──
  gate-external-prs:
    name: External PR approval gate
    runs-on: ubuntu-latest
    outputs:
      approved: ${{ steps.check.outputs.approved }}
    permissions:
      pull-requests: read
      issues: read
    steps:
      - name: Check repository membership or ci-approved label
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: |
          # Pushes to main/master do not need PR approval.
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "approved=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Repository owners, members, and collaborators can run CI directly.
          case "$PR_AUTHOR_ASSOCIATION" in
            OWNER|COLLABORATOR|MEMBER)
              echo "approved=true (repository member)" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          # External contributors need a maintainer-applied ci-approved label.
          HAS_LABEL=$(curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER" | \
            python3 -c "import sys,json; labels=[t['name'] for t in json.load(sys.stdin).get('labels',[])]; print('yes' if 'ci-approved' in labels else 'no')" 2>/dev/null || echo "no")

          if [ "$HAS_LABEL" = "yes" ]; then
            echo "approved=true (ci-approved label)" >> "$GITHUB_OUTPUT"
          else
            echo "approved=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Lint ──
  lint:
    name: Lint (go vet)
    runs-on: ubuntu-latest
    needs: [gate-external-prs]
    if: needs.gate-external-prs.outputs.approved == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run go vet
        run: go vet ./...

  # ── Tests ──
  test:
    name: Tests (go test -race)
    runs-on: ubuntu-latest
    needs: [gate-external-prs]
    if: needs.gate-external-prs.outputs.approved == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run tests
        run: go test -v -count=1 -race ./...

  # ── Build binaries (cross-arch) ──
  build:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [gate-external-prs]
    if: needs.gate-external-prs.outputs.approved == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux/amd64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
          - name: linux/arm64
            os: ubuntu-26.04-arm
            goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build binary (${{ matrix.name }})
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build \
            -ldflags="-s -w" \
            -o sit-ics-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/sit-ics

      - name: Upload artifact (${{ matrix.name }})
        uses: actions/upload-artifact@v4
        with:
          name: sit-ics-${{ matrix.goos }}-${{ matrix.goarch }}
          path: sit-ics-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: 1

