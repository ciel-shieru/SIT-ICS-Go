  # ── Build and push debug container image (every commit/PR) ──
  build-debug-image:
    name: Debug image (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    needs: [gate-external-prs]
    if: needs.gate-external-prs.outputs.approved == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-26.04-arm
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Docker meta (debug)
        id: debug-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=debug-,suffix=-${{ matrix.arch }}
            type=ref,event=branch,prefix=debug-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR (debug)
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push debug image (${{ matrix.arch }})
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/${{ matrix.arch }}
          tags: ${{ steps.debug-meta.outputs.tags }}
          labels: |
            org.opencontainers.image.description=Debug image for sit-ics-go (non-root, distroless)
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            debug=true
          # cache-from: type=gha
          # cache-to: type=gha,mode=max
